services:
  - type: web
    name: manamesh-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CARD_DATABASE_PATH
        value: card_hashes.pkl
      - key: PYTHON_VERSION
        value: 3.11.9
